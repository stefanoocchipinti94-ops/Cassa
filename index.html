<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cassa">
<meta name="theme-color" content="#F3F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Registro di Cassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: colonna da telefono (max 560px). Saluto + menu a tendina; il salvadanaio "Salvo" con la cifra di oggi; tasti rapidi; barra in basso con "+" centrale. */
:root{
  --bg:#F3F3EE; --card:#FFFFFF; --ink:#1F2230; --muted:#6E7180; --line:#E3E3DC; --line-strong:#CACAC0;
  --acc:#5559D8; --on-acc:#FFFFFF; --in:#23875A; --out:#D9442B; --warn:#C98A12; --pig:#F6B3C2; --pig-ink:#C9566F;
  --shadow:0 1px 2px rgba(30,30,60,.06),0 8px 20px -12px rgba(30,30,60,.28);
  --f-display:"Fredoka","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  --emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13141A; --card:#1E2029; --ink:#EEEFF5; --muted:#A3A6B5; --line:#2F3240; --line-strong:#4A4E60;
  --in:#5CCB92; --out:#FF7A5E; --warn:#F2B84B; --pig:#E68FA3; --pig-ink:#FFC3D0; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13141A; --card:#1E2029; --ink:#EEEFF5; --muted:#A3A6B5; --line:#2F3240; --line-strong:#4A4E60;
  --in:#5CCB92; --out:#FF7A5E; --warn:#F2B84B; --pig:#E68FA3; --pig-ink:#FFC3D0; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
:root{--acc-soft:color-mix(in srgb,var(--acc) 15%,var(--card));--acc-tint:color-mix(in srgb,var(--acc) 8%,var(--bg))}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.emo{font-family:var(--emo);line-height:1;font-weight:400}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-bottom:130px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.15;text-wrap:balance}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h small{color:var(--muted);font-size:13px;font-weight:700}
.pos{color:var(--in)}.neg{color:var(--out)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.hello{min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.hello h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,5.8vw,26px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello h1 b{color:var(--acc);font-weight:600}
.avatar{border:0;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:24px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative;flex:none}
.avatar .caret{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);font-size:11px;display:grid;place-items:center;box-shadow:var(--shadow);font-weight:800}
.menu{position:fixed;z-index:40;right:max(16px,calc(50% - 264px));top:calc(70px + env(safe-area-inset-top,0px));width:min(280px,calc(100% - 32px));background:var(--card);border-radius:22px;box-shadow:0 20px 50px -15px rgba(20,20,50,.45);padding:8px;animation:pop .16s ease-out;transform-origin:top right}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:14px;font-weight:700;text-align:left;font-size:15px}
.menu button:hover,.menu button:focus-visible{background:var(--acc-tint)}
.menu .emo{font-size:20px;width:26px;text-align:center}
.menu-scrim{position:fixed;inset:0;z-index:39}
.banner{font-size:14px;background:var(--acc-soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:4px}
.banner button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;white-space:nowrap}
.view{display:flex;flex-direction:column;gap:18px;padding-top:10px}

.hero{background:var(--card);border-radius:28px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;gap:14px;align-items:center}
.hero svg{width:84px;height:70px;flex:none}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.01em;margin:4px 0}
.hero p{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.bar-l{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles3>div{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tiles3 .v{font-family:var(--f-display);font-weight:600;font-size:19px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{border:0;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;align-self:flex-start}

.quick{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 8px}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex:none;border:0;background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:104px;text-align:left}
.qbtn .emo{font-size:28px}
.qbtn b{font-weight:800;font-size:14px;line-height:1.15}
.qbtn span{font-size:13px;font-weight:700;color:var(--muted)}
.qbtn.add{background:none;box-shadow:none;border:2px dashed var(--line-strong);justify-content:center;align-items:center}

.list{background:var(--card);border-radius:24px;padding:4px 14px;box-shadow:var(--shadow)}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 0 4px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.list .row:last-child{border-bottom:0}
.row .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--acc-tint)}
.row .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;color:var(--muted);font-weight:700}
.row .a{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;font-weight:800;margin-left:4px}
.tag.fix{background:var(--line);color:var(--muted)}.tag.unx{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.empty{color:var(--muted);font-size:15px;padding:18px;text-align:center;border:2px dashed var(--line-strong);border-radius:22px;font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.filters::-webkit-scrollbar{display:none}
.filters>*{flex:none;white-space:nowrap}
.dd{position:relative;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
.dd select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:10px 32px 10px 14px;font-weight:800;font-size:14px;cursor:pointer}
.dd::after{content:"▾";position:absolute;right:13px;pointer-events:none;color:var(--acc);font-size:13px}
.dd.on{background:var(--acc);color:var(--on-acc)}.dd.on::after{color:var(--on-acc)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.catbars{display:flex;flex-direction:column;gap:12px}
.cb{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center}
.cb .ic{font-size:22px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--acc-tint)}
.cb-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.cb-top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.cb-track{height:8px;background:var(--line);border-radius:999px;margin-top:4px;overflow:hidden}
.cb-track i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .col i{display:block;width:100%;max-width:38px;border-radius:10px 10px 4px 4px}
.bars .col b{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .col small{font-size:11px;color:var(--muted);font-weight:700}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:80px}
.hours i{display:block;border-radius:3px 3px 1px 1px;background:var(--line-strong);min-height:2px}
.hours i.pk{background:var(--acc)}
.hlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.btn{border:0;background:var(--bg);border-radius:16px;padding:12px 16px;font-weight:800;font-size:15px}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.danger{background:color-mix(in srgb,var(--out) 14%,var(--card));color:var(--out)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:14px}
.btn.wide{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
textarea.paste{min-height:80px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);display:flex;justify-content:center;padding:4px 8px env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px -16px rgba(30,30,60,.5);border-radius:24px 24px 0 0}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px;align-items:end}
.tabs button{border:0;background:none;padding:6px 2px 10px;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs .ic{font-size:22px;width:52px;height:32px;border-radius:999px;display:grid;place-items:center;filter:grayscale(.9);opacity:.75}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ic{background:var(--acc-soft);filter:none;opacity:1}
.tabs .plus .ic{width:60px;height:60px;border-radius:22px;background:var(--acc);color:var(--on-acc);filter:none;opacity:1;font-family:var(--f-display);font-size:34px;font-weight:600;margin-top:-26px;box-shadow:0 12px 22px -10px var(--acc)}

.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,15,30,.45)}
.panel-s{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:93%;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .24s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line-strong);margin:0 auto}
.closex{position:absolute;right:14px;top:12px;border:0;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:16px}
.panel-s h2{font-size:22px;padding-right:40px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:999px;padding:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"][data-type="out"]{background:var(--out);color:#fff}
.seg button[aria-pressed="true"][data-type="in"]{background:var(--in);color:#fff}
.amt{display:flex;align-items:baseline;gap:6px;background:var(--card);border-radius:22px;padding:10px 18px;box-shadow:var(--shadow)}
.amt span{font-family:var(--f-display);font-size:32px;color:var(--muted)}
.amt input{border:0;background:none;font-family:var(--f-display);font-weight:600;font-size:46px;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:0;background:var(--card);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);min-width:0}
.cat .emo{font-size:26px}
.cat span:last-child{font-size:11.5px;font-weight:700;line-height:1.15;text-align:center}
.cat[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc);background:var(--acc-tint)}
.toggle{display:flex;align-items:center;gap:10px;border:0;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-weight:700;width:100%;text-align:left}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 16%,var(--card));box-shadow:0 0 0 2px var(--warn)}
details.more{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
details.more summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more .grid2{margin-top:10px}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sw{border:0;border-radius:18px;padding:10px 6px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px}
.sw i{width:32px;height:32px;border-radius:50%;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{border:0;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px}
.avpick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc)}
.err{color:var(--out);font-size:14px;margin:0;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;font-size:15px;font-weight:700;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.toast button{border:0;background:none;color:var(--warn);font-weight:800;padding:0}
.popfx{position:fixed;left:50%;top:45%;z-index:60;font-size:60px;pointer-events:none;animation:popfx 1s ease-out forwards}
@keyframes popfx{0%{opacity:0;transform:translate(-50%,0) scale(.4)}25%{opacity:1;transform:translate(-50%,-20px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120px)}}
.welcome{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.welcome .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.welcome .hi{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.welcome .hi svg{width:130px;height:108px}
.welcome h1{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0;line-height:1.1}
.welcome p{margin:0;color:var(--muted);font-weight:600}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="hello"><small id="hiSub"></small><h1 id="hiTitle">Ciao!</h1></div>
    <button class="avatar" id="avatarBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Apri il menu"><span class="emo" id="avEmo">😎</span><span class="caret" aria-hidden="true">▾</span></button>
  </header>
  <div id="demoBanner" class="banner" hidden><span>Questi sono dati di esempio, per vedere come funziona.</span><button id="demoClear">Inizia da zero</button></div>
  <main>
    <section id="v-oggi" class="view"></section>
    <section id="v-mov" class="view" hidden></section>
    <section id="v-ana" class="view" hidden></section>
    <section id="v-fissi" class="view" hidden></section>
  </main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="tabs-in">
  <button data-tab="oggi" aria-current="page"><span class="ic emo">🐷</span>Oggi</button>
  <button data-tab="mov"><span class="ic emo">📒</span>Movimenti</button>
  <button class="plus" id="plusBtn" aria-label="Registra un movimento"><span class="ic">+</span>Registra</button>
  <button data-tab="ana"><span class="ic emo">📊</span>Analisi</button>
  <button data-tab="fissi"><span class="ic emo">🔁</span>Fissi</button>
</div></nav>
<div id="sheet" class="sheet" hidden><div class="scrim" id="scrim"></div><div class="panel-s" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY='registro-cassa.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const EUR=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const EUR0=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmt=c=>EUR.format((c||0)/100);
const fmt0=c=>EUR0.format(Math.round((c||0)/100));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MSH=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

/* ---------- ricorrenti ---------- */
function occurrences(r,until){const out=[];const[y,m,d]=r.start.split('-').map(Number);
  for(let i=0;i<3000;i++){let dt;
    if(r.freq==='settimanale')dt=new Date(y,m-1,d+7*i);
    else{const step={mensile:1,trimestrale:3,annuale:12}[r.freq]||1;const mm=m-1+step*i;const last=new Date(y,mm+1,0).getDate();dt=new Date(y,mm,Math.min(d,last))}
    if(dt>until)break;out.push(ymd(dt))}return out}
function syncRecurring(){const now=new Date();let n=0;
  for(const r of S.rec){if(!r.active)continue;
    for(const ds of occurrences(r,now)){const k=r.id+'|'+ds;if(S.gen[k])continue;S.gen[k]=1;
      S.tx.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,note:r.name,ts:ds+'T'+(r.time||'08:00'),unexp:false,rec:r.id});n++}}
  if(n)save()}
function nextOcc(r){const t=ymd(new Date());const lim=new Date();lim.setDate(lim.getDate()+400);return occurrences(r,lim).find(d=>d>=t)||null}

/* ---------- calcoli ---------- */
const inMonth=(y,m)=>{const p=y+'-'+pad(m+1);return S.tx.filter(t=>t.ts.startsWith(p))};
function stats(y,m){
  const now=new Date(),dim=new Date(y,m+1,0).getDate();const cur=now.getFullYear()===y&&now.getMonth()===m;const past=new Date(y,m+1,0,23,59)<now;
  const elapsed=cur?now.getDate():past?dim:0;
  const st={y,m,dim,cur,elapsed,inc:0,out:0,fixed:0,unexp:0,vari:0,cofN:0,cofA:0,byCat:{},byHour:Array(24).fill(0),txs:inMonth(y,m)};
  const today=ymd(now);let varBefore=0,varToday=0;
  for(const t of st.txs){if(t.type==='in'){st.inc+=t.amt;continue}
    st.out+=t.amt;st.byCat[t.cat]=(st.byCat[t.cat]||0)+t.amt;
    if(t.rec)st.fixed+=t.amt;else{if(t.unexp)st.unexp+=t.amt;else{st.vari+=t.amt;const d=t.ts.slice(0,10);if(d<today)varBefore+=t.amt;else if(d===today)varToday+=t.amt}st.byHour[+t.ts.slice(11,13)||0]+=t.amt}
    if(t.cat==='caffe'){st.cofN++;st.cofA+=t.amt}}
  st.net=st.inc-st.out;st.rate=st.inc>0?st.net/st.inc:null;
  let remOut=0,remIn=0;
  if(cur){const end=new Date(y,m+1,0,23,59);for(const r of S.rec){if(!r.active)continue;for(const d of occurrences(r,end)){if(d.slice(0,7)!==y+'-'+pad(m+1)||S.gen[r.id+'|'+d])continue;if(r.type==='in')remIn+=r.amt;else remOut+=r.amt}}}
  const avgVar=elapsed?st.vari/elapsed:0;st.avgVar=avgVar;
  st.projIn=st.inc+remIn;st.projOut=st.out+remOut+(cur?avgVar*(dim-elapsed):0);st.projNet=st.projIn-st.projOut;
  if(cur){const daysLeft=dim-now.getDate()+1;const budget=st.projIn-(st.fixed+remOut)-st.unexp-(S.goal||0)-varBefore;
    st.perDay=budget/daysLeft;st.todayLeft=st.perDay-varToday;st.daysLeft=daysLeft;st.varToday=varToday;
    st.monthBudget=st.projIn-(st.fixed+remOut)-(S.goal||0);st.monthSpentVar=st.vari+st.unexp}
  return st}
function parseAmt(s){s=String(s||'').trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'');const v=parseFloat(s.replace(',','.'));return isFinite(v)?Math.round(v*100):NaN}

function seedDemo(){
  const prof=S?S.profile:{...P0};S=blank();S.profile=prof;S.demo=true;S.goal=40000;
  const R=(name,amt,type,cat,freq,start,time)=>S.rec.push({id:uid(),name,amt,type,cat,freq,start,time:time||'08:00',active:true});
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();const s0=new Date(y,m-2,1);const st=d=>ymd(new Date(s0.getFullYear(),s0.getMonth(),d));
  R('Stipendio',215000,'in','stipendio','mensile',st(27),'09:00');R('Affitto',65000,'out','casa','mensile',st(1));R('Luce e gas',8500,'out','bollette','mensile',st(15));
  R('Telefono',999,'out','bollette','mensile',st(20));R('Netflix',1399,'out','abbonamenti','mensile',st(12));R('Spotify',1099,'out','abbonamenti','mensile',st(5));
  R('Palestra',4500,'out','abbonamenti','mensile',st(3));R('Assicurazione auto',52000,'out','tasse','annuale',st(18));
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const add=(d,h,mi,amt,cat,note,unexp)=>{const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi);if(dt>now)return;S.tx.push({id:uid(),type:'out',amt,cat,note,ts:ymd(dt)+'T'+hm(dt),unexp:!!unexp,rec:null})};
  for(let d=new Date(s0);d<=now;d.setDate(d.getDate()+1)){const dow=d.getDay(),wk=dow>0&&dow<6;
    if(wk){add(d,7,40+Math.floor(rnd()*15),120,'caffe','Caffè');if(rnd()<.55)add(d,10,30+Math.floor(rnd()*20),rnd()<.5?130:150,'caffe','Caffè');if(rnd()<.3)add(d,13,10,1100+Math.floor(rnd()*500),'ristoranti','Pranzo fuori')}
    else if(rnd()<.7)add(d,10,15,280,'caffe','Cappuccino e cornetto');
    if(dow===2||dow===6)add(d,18,30,2800+Math.floor(rnd()*5500),'spesa','Supermercato');
    if(dow===6&&rnd()<.75)add(d,21,0,2600+Math.floor(rnd()*3600),'ristoranti','Cena fuori');
    if(d.getDate()%10===4)add(d,19,10,6000+Math.floor(rnd()*1500),'carburante','Pieno');
    if(dow===5&&rnd()<.4)add(d,22,30,1500+Math.floor(rnd()*2000),'svago','Uscita con amici');
    if(rnd()<.06)add(d,17,20,2500+Math.floor(rnd()*6000),'shopping','Acquisto online')}
  add(new Date(y,m-1,18),12,5,12000,'trasporti','Gomma forata',true);add(new Date(y,m,3),16,40,9000,'salute','Dentista',true);
  syncRecurring();save()}

function monthDD(){const opts=[];const d=new Date();for(let i=0;i<13;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);opts.push([x.getFullYear()+'-'+x.getMonth(),(i===0?'📅 Questo mese':'📅 '+MONTHS[x.getMonth()]+' '+x.getFullYear())])}

function dd(id,val,opts,on,lab){return `<label class="dd ${on?'on':''}"><select id="${id}" aria-label="${lab}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`}
function rowHTML(t){const sign=t.type==='in'?'+':'−';

function grouped(list){const by={};list.forEach(t=>{(by[t.ts.slice(0,10)]=by[t.ts.slice(0,10)]||[]).push(t)});
  return Object.keys(by).sort().reverse().map(d=>{const items=by[d].sort((a,b)=>b.ts.localeCompare(a.ts));const dt=new Date(d+'T12:00');const o=items.filter(t=>t.type==='out').reduce((s,t)=>s+t.amt,0);
    return `<div class="day-h"><span>${DOW[dt.getDay()]} ${dt.getDate()} ${MSH[dt.getMonth()]}</span><span class="num">${o?'−'+fmt(o):''}</span></div>`+items.map(rowHTML).join('')}).join('')}

  else{mood=st.projNet<0?'sad':st.net>=0?'happy':'ok';title=`Risparmio di ${mName} finora`;big=`<div class="big num ${st.net<0?'neg':'pos'}">${fmt(st.net)}</div>`;sub='Imposta un obiettivo e ti dico quanto puoi spendere ogni giorno.'}

  if(e.target.closest('#avatarBtn')){$('#menu')?closeMenu():openMenu();return}
  const ed=e.target.closest('[data-edit]');if(ed){openTx(S.tx.find(t=>t.id===ed.dataset.edit));return}
  const rc=e.target.closest('[data-rec]');if(rc){openRec(S.rec.find(r=>r.id===rc.dataset.rec));return}
  const q=e.target.closest('[data-quick]');if(q){const p=S.presets.find(x=>x.id===q.dataset.quick);const n=new Date();const t={id:uid(),type:'out',amt:p.amt,cat:p.cat,note:p.name,ts:ymd(n)+'T'+hm(n),unexp:false,rec:null};S.tx.push(t);save();render();popFx(catE(p.cat));toast(p.name+' · '+fmt(p.amt),()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();render()});return}
  const id=e.target.closest('button')?.id;
  if(id==='editPresets')openPresets();
  if(id==='goGoal'){setTab('fissi');setTimeout(()=>{const g=$('#goalIn');g&&g.focus()},60)}
  if(id==='addRec')openRec(null);
  if(id==='goalSave'){const v=$('#goalIn').value.trim();const a=v?parseAmt(v):0;if(isNaN(a)){toast('Importo non valido');return}S.goal=a;save();render();popFx('🎯');toast(a?'Obiettivo: '+fmt0(a)+' al mese':'Obiettivo rimosso')}
  if(id==='demoClear'){const prof=S.profile,pr=S.presets;S=blank();S.profile=prof;S.presets=pr;save();render();toast('Pronto: registra la prima spesa con +')}
  if(id==='bkCopy')copyText(backupJSON(),'Backup copiato. Incollalo in Note o File.');
  if(id==='csvCopy')copyText(csv(),'Copiato: incollalo in Excel o Numbers.');
  if(id==='bkShare'){const name='registro-cassa-'+ymd(new Date())+'.json';const blob=new Blob([backupJSON()],{type:'application/json'});let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(er){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'Backup Registro di Cassa'}).catch(()=>{});else copyText(backupJSON(),'Backup copiato. Incollalo in Note o File.')}
  if(id==='bkRestore'){const v=$('#bkPaste').value.trim();$('#bkMsg').textContent=v?restore(v):'Incolla prima il testo del backup.'}
  if(id==='resetBtn'){const b=e.target.closest('button');if(b.dataset.armed){const prof=S.profile;S=blank();S.profile=prof;save();closeSheet();render();toast('Dati cancellati')}else{b.dataset.armed=1;b.textContent='Tocca di nuovo per confermare'}}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='mSel'){const[y,m]=e.target.value.split('-').map(Number);V.y=y;V.m=m;render();return}
  if(id==='tSel'){V.type=e.target.value;rMov();return}
  if(id==='cSel'){V.cat=e.target.value;rMov();return}
  if(id==='bkFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bkMsg').textContent=restore(r.result)};r.readAsText(f)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;rMovList()}});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#menu'))closeMenu();else if(!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncRecurring();render()}});

/* ---------- avvio ---------- */
const o=load();S=o?migrate(o):blank();
syncRecurring();applyTheme();render();
if(!S.profile.onboarded)openWelcome(false);
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>

</body>
